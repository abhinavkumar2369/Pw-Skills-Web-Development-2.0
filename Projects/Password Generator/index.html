<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="result-container">
            <span class="result" id="result"></span>
            <button class="btn-clipboard" id="clipboard" title="Copy to clipboard">📋</button>
        </div>
        
        <div class="settings">
            <div class="setting">
                <label>Password Length</label>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <input type="range" id="length" min="4" max="32" value="16">
                    <input type="number" id="lengthNumber" min="4" max="32" value="16">
                </div>
            </div>
            
            <div class="setting">
                <label>Include Uppercase Letters</label>
                <input type="checkbox" id="uppercase" checked>
            </div>
            
            <div class="setting">
                <label>Include Lowercase Letters</label>
                <input type="checkbox" id="lowercase" checked>
            </div>
            
            <div class="setting">
                <label>Include Numbers</label>
                <input type="checkbox" id="numbers" checked>
            </div>
            
            <div class="setting">
                <label>Include Symbols</label>
                <input type="checkbox" id="symbols" checked>
            </div>
        </div>
        
        <div class="strength-meter">
            <p>Password Strength: <span id="strength-text">Medium</span></p>
            <div class="strength-bars" id="strength-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>
        
        <button class="btn generate" id="generate">Generate Password</button>
    </div>
    
    <div class="toast" id="toast">Copied to clipboard!</div>
    
    <script src="script.js"></script>
</body>
</html>
